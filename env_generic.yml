name: schiit_main
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - pandas
  - matplotlib
  - scipy
  - networkx
  - scikit-learn  # this is sklearn
  - statsmodels
  - scanpy
  - anndata
  - pytorch  # this is torch
  - torchvision
  - torchaudio
  - faiss-cpu  # or faiss-gpu if you need GPU support
  - tqdm
  - pip
  - pip:
      - -e .
      - transformers
      - sentence-transformers
      - cellxgene-census
      - tiledbsoma
      - pronto
